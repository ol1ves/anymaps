<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anymaps</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="map-wrap">
        <div id="map"></div>
        <div id="camera-badge" aria-hidden="true">
          <span id="camera-badge-label">Camera</span>
          <button id="camera-badge-release">Release</button>
        </div>
      </div>
      <div id="sidebar">
        <h1 class="anymaps-brand">
          <svg
            class="anymaps-brand-mark"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.75" />
            <path
              d="M12 2v4M12 18v4M2 12h4M18 12h4"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
            />
            <circle cx="12" cy="12" r="1.75" fill="currentColor" />
          </svg>
          <span>anymaps</span>
        </h1>
        <div id="panel-host"></div>
        <div id="gallery"></div>
        <div id="wizard"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
