<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anymaps</title>
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("anymaps.theme");
          if (saved === "dark" || saved === "light") {
            theme = saved;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
        } catch (e) {
          /* keep light */
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="map-wrap">
        <div id="map"></div>
        <div id="camera-badge" aria-hidden="true">
          <span id="camera-badge-label">Camera</span>
          <button id="camera-badge-release">Release</button>
        </div>
      </div>
      <div id="sidebar">
        <h1 class="anymaps-brand">
          <svg
            class="anymaps-brand-mark"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.75" />
            <path
              d="M12 2v4M12 18v4M2 12h4M18 12h4"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
            />
            <circle cx="12" cy="12" r="1.75" fill="currentColor" />
          </svg>
          <span>anymaps</span>
          <button
            id="theme-toggle"
            class="anymaps-theme-toggle"
            type="button"
            aria-pressed="false"
            aria-label="Switch to dark theme"
          >
            <svg
              class="anymaps-theme-icon anymaps-theme-icon-sun"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.75" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
            <svg
              class="anymaps-theme-icon anymaps-theme-icon-moon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </h1>
        <div id="panel-host"></div>
        <div id="gallery"></div>
        <div id="wizard"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
