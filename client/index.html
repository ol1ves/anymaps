<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anymaps</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: flex;
        height: 100%;
      }
      #map {
        flex: 1;
        min-width: 0;
      }
      #sidebar {
        width: 320px;
        border-left: 1px solid #e5e7eb;
        padding: 16px;
        overflow-y: auto;
        box-sizing: border-box;
        background: #fafafa;
        color: #1f2937;
      }
      #sidebar h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #sidebar p {
        margin: 0;
        font-size: 13px;
        color: #6b7280;
        line-height: 1.5;
      }
      .anymaps-attrib {
        display: inline-flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 12px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        color: rgba(0, 0, 0, 0.7);
        font: 12px/1.5 system-ui, sans-serif;
      }
      .anymaps-attrib summary {
        list-style: none;
        cursor: pointer;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .anymaps-attrib summary::-webkit-details-marker {
        display: none;
      }
      .anymaps-attrib-inner {
        padding: 2px 8px 2px 0;
        white-space: nowrap;
      }
      .anymaps-attrib a {
        color: inherit;
        text-decoration: none;
      }
      .anymaps-attrib a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <div id="sidebar">
        <h1>anymaps</h1>
        <p>Hello world. The WidgetManager sidebar lands here.</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
